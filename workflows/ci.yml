name: CI for project #название 

on: #триггер начала работы (в примере  при любом пуше или пулле в ветку main)
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs: #задачи для выполнения
  hello-world: #название job-а
    runs-on: ubuntu-latest
    
    steps: #подшаги в рамках job
    - name: Checkout code
      uses: actions/checkout@v3 #копирование кода на VM
      
    - name: Say Hello
      run: echo "Hello, GitHub Actions! This is my first workflow!"
      
    - name: Show date
      run: date